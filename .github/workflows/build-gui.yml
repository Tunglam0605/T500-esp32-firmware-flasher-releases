name: Build GUI release

on:
  push:
    tags:
      - "gui-v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: T500_Firmware_Flasher_Windows_x64.exe
          - os: ubuntu-latest
            artifact: T500_Firmware_Flasher_Linux_x86_64
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: python -m pip install -r requirements.txt

      - name: Build icons
        run: python scripts/make_icons.py

      - name: Build Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed `
            --name T500_Firmware_Flasher_Windows_x64 `
            --icon assets/logo.ico `
            --paths src `
            --collect-all esptool `
            --add-data "assets;assets" `
            --add-data "manifest.json;." `
            --add-data "bundled_firmware;bundled_firmware" `
            run_gui.py

      - name: Build Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed \
            --name T500_Firmware_Flasher_Linux_x86_64 \
            --icon assets/logo.png \
            --paths src \
            --collect-all esptool \
            --add-data "assets:assets" \
            --add-data "manifest.json:." \
            --add-data "bundled_firmware:bundled_firmware" \
            run_gui.py
          chmod +x dist/T500_Firmware_Flasher_Linux_x86_64

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          name: T500 Firmware Flasher ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/${{ matrix.artifact }}
